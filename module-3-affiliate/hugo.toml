baseURL = "https://ysolutionearn.netlify.app/"
languageCode = "it-IT"
title = "Ysolution.earn — Tool, VPN e Hosting per Sviluppatori"
theme = "PaperMod"

[params]
  description = "Guide e recensioni per sviluppatori: VPN, hosting, tool SaaS e produttività. Aggiornate ogni settimana."
  author = "Ysolution.earn"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  defaultTheme = "dark"

[taxonomies]
  category = "categories"
  tag = "tags"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "VPN"
    url = "/categories/vpn/"
    weight = 2
  [[menu.main]]
    name = "Hosting"
    url = "/categories/hosting/"
    weight = 3
  [[menu.main]]
    name = "Dev Tools"
    url = "/categories/dev-tools/"
    weight = 4

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "dracula"
    lineNos = true

[sitemap]
  changefreq = "weekly"
  priority = 0.5
